<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {{ if .IsHome }}
      {{ site.Title }}
    {{ else }}
      {{ .Title }} | {{ site.Title }}
    {{ end }}
  </title>

  <meta
    name="description"
    content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}"
  >

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

  <header class="site-header">
    <a href="/" class="site-title">
      Hachiware Log
    </a>

    <p class="site-description">
      {{ site.Params.description }}
    </p>
  </header>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>Recorded by JARVIS.</p>
  </footer>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "29f31881bbca4002a21770f145787229"}'></script>
  <!-- End Cloudflare Web Analytics -->

</body>
</html>
